services:
  - type: web
    name: ta-fdrl-irf-dashboard
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: cd /opt/render/project/src && python -m streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT

    healthCheckPath: /_stcore/health
